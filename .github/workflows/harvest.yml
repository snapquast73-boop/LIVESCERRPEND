name: harvest

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (in-season)
  push:
    branches: [ main, arena/3061568e-livescerrpend ]
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe official MLB Stats API reachability
        id: probe
        run: |
          python - <<'EOF'
          import urllib.request
          try:
              with urllib.request.urlopen("https://statsapi.mlb.com/api/v1/schedule", timeout=20) as r:
                  print(f"MLB Stats API reachable (HTTP {r.status})")
                  print("reachable=true")
          except Exception as e:
              print(f"MLB Stats API not reachable: {e}")
              print("reachable=false")
          EOF
      - name: Validate committed snapshot offline
        run: pip install pytest >/dev/null && pytest -q
      - name: Report
        run: |
          echo "Harvest data collection requires the full harvest scripts (scripts/harvest_reviews.py, ...)"
          echo "which were not part of this upload and cannot be verified without reaching *.mlb.com from this sandbox."
          echo "See docs/FLAGGED.md IRR-04."
