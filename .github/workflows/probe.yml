name: probe

# Temporary diagnostic workflow (deleted before merge).
on:
  push:
    branches: [arena/c68ee0e2-livescerrpend]
    paths: [".github/workflows/probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Trace the anchor games and sample dates
        run: |
          python3 scripts/trace_game.py 823616 778307 > trace-out.txt 2>&1
          python3 scripts/trace_game.py --sample 2024-06-01 2025-07-15 2026-06-13 >> trace-out.txt 2>&1
          grep -c "<<<" trace-out.txt || true
          tail -12 trace-out.txt
      - name: Commit trace output
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add trace-out.txt
          git commit -m "probe: trace $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push origin HEAD:arena/c68ee0e2-livescerrpend
