name: probe

# Temporary diagnostic workflow (deleted before merge).
on:
  push:
    branches: [arena/c68ee0e2-livescerrpend]
    paths: [".github/workflows/probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Harvest a small slice of the official feed
        run: |
          python3 scripts/harvest.py --season 2026 --max-games 25 --force 2>&1 | tail -30
      - name: Build the payload from the slice
        run: |
          python3 scripts/build_payload.py 2>&1 | tail -20
      - name: Probe the scoring-change bulletin and Savant clip pages
        run: |
          python3 - <<'EOF' > probe-out.txt 2>&1
          import json, re, urllib.request

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (probe)"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.status, r.headers.get("content-type"), r.read()

          url = "https://www.mlb.com/official-information/scoring-changes"
          status, ctype, body = fetch(url)
          html = body.decode("utf-8", "replace")
          print("bulletin:", status, ctype, len(html), "bytes")
          open("bulletin.html", "w").write(html)
          text = re.sub(r"<script.*?</script>", " ", html, flags=re.S)
          text = re.sub(r"<style.*?</style>", " ", text, flags=re.S)
          text = re.sub(r"<[^>]+>", "\n", text)
          text = re.sub(r"\n{2,}", "\n", text)
          print("visible text length:", len(text))
          print("---- first 2500 chars of visible text ----")
          print(text[:2500])
          print("---- occurrences of 'In the' ----", text.count("In the"))
          print("---- occurrences of 'now' ----", text.count(" now "))
          idx = text.find("In the")
          print("---- context ----")
          print(text[max(0, idx-500):idx+1200])

          for play_id in ("9238a9d4-3741-36f7-8fac-191567cd87e6",
                          "4ff0b9e8-374a-34e0-9adc-f5c198e858b3"):
              try:
                  s, c, b = fetch("https://baseballsavant.mlb.com/sporty-videos?playId=" + play_id)
                  print("savant", play_id, s, c, len(b))
              except Exception as e:
                  print("savant", play_id, "error", e)
          EOF
          head -c 2000 probe-out.txt
      - name: Commit probe output
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add probe-out.txt bulletin.html data/seasons data/site 2>/dev/null || true
          git commit -m "probe/harvest slice $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push origin HEAD:arena/c68ee0e2-livescerrpend
