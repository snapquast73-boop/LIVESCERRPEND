name: probe

# Temporary diagnostic workflow (deleted before merge).
on:
  push:
    branches: [arena/c68ee0e2-livescerrpend]
    paths: [".github/workflows/probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe official MLB feeds
        run: |
          python3 - <<'EOF' > probe-out.txt 2>&1
          import json, urllib.request

          def get(url):
              with urllib.request.urlopen(url, timeout=60) as r:
                  return json.load(r)

          print("=== reviewReasons registry ===")
          print(json.dumps(get("https://statsapi.mlb.com/api/v1/reviewReasons"))[:3000])

          print("\n=== eventTypes: pending entries ===")
          et = get("https://statsapi.mlb.com/api/v1/eventTypes")
          for e in et:
              if "pending" in json.dumps(e).lower():
                  print(json.dumps(e))

          for pk in (823616, 778307):
              print(f"\n=== game {pk} ===")
              feed = get(f"https://statsapi.mlb.com/api/v1/game/{pk}/playByPlay")
              print("top-level keys:", list(feed.keys()))
              plays = feed.get("allPlays", [])
              print("plays:", len(plays))
              for play in plays:
                  rd = play.get("reviewDetails")
                  ev_rd = [(e.get("index"), e.get("reviewDetails"), e.get("details"))
                           for e in play.get("playEvents", []) if e.get("reviewDetails")]
                  if not rd and not ev_rd:
                      continue
                  out = {
                      "atBatIndex": play.get("atBatIndex"),
                      "about": play.get("about"),
                      "result": play.get("result"),
                      "reviewDetails": rd,
                      "eventReviewDetails": ev_rd,
                      "runners": [
                          {"movement": r.get("movement"),
                           "details": {k: r.get("details", {}).get(k) for k in
                                       ("eventType", "event", "isScoringEvent", "rbi", "earned", "playIndex")}}
                          for r in play.get("runners", [])
                      ],
                      "lastEventIndex": (play.get("playEvents") or [{}])[-1].get("index"),
                  }
                  print(json.dumps(out, indent=1)[:5000])
          EOF
          echo "--- exit $? ---"
      - name: Commit probe output
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add probe-out.txt
          git commit -m "probe output $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push origin HEAD:arena/c68ee0e2-livescerrpend
