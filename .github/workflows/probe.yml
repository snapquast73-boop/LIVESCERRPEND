name: probe

# Temporary diagnostic workflow (deleted before merge).
on:
  push:
    branches: [arena/c68ee0e2-livescerrpend]
    paths: [".github/workflows/probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Trace games that failed the occupancy invariant
        run: |
          python3 scripts/trace_game.py 744795 > trace-out.txt 2>&1
          python3 scripts/trace_game.py 745980 >> trace-out.txt 2>&1
          grep -n "<<<" trace-out.txt || echo "no invariant issues"
      - name: Commit trace output
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add trace-out.txt
          git commit -m "probe: trace $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push origin HEAD:arena/c68ee0e2-livescerrpend
