name: probe

# Temporary diagnostic workflow (deleted before merge). Rerun 7.
on:
  push:
    branches: [arena/c68ee0e2-livescerrpend]
    paths: [".github/workflows/probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the official drift check and capture the failure
        run: |
          python3 scripts/check_official.py > official-out.txt 2>&1 || true
          tail -40 official-out.txt
      - name: Commit output
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add official-out.txt
          git commit -m "probe: official check $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push origin HEAD:arena/c68ee0e2-livescerrpend
